name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # No lockfile is committed, so `npm ci` is not available.
      - run: npm install

      - run: npm run lint

      # The hand-authored packs' gate: plain Node over packs/_source and system.json, so it needs
      # nothing this checkout does not already have. The schema half of the same check runs where the
      # packs are authored, because it loads Foundry's common/ from an installed build.
      - run: npm run lint:packs

      # The rules against their own fixtures: every cliff fires on the broken ones, the correct ones
      # draw nothing. It is what keeps the gate honest while the roster still has no authored pack.
      - run: npm run lint:packs:selftest

      - name: Build stylesheet
        run: npm run styles

      # styles/mgt2.css is committed; a drift means the build output was not regenerated.
      - name: Verify committed stylesheet is up to date
        run: git diff --exit-code -- styles/mgt2.css

      # The compiled compendiums are not committed; `compile` proves the committed packs/_source
      # still builds. The docs journals are generated outside this repository — packs/_source is
      # where that generator hands over, and it is committed.
      - name: Compile compendiums
        run: npm run compile
