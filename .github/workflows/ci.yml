name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No lockfile is committed, so `npm ci` is not available.
      - run: npm install

      - run: npm run lint

      - name: Build stylesheet
        run: npm run styles

      # styles/mgt2.css is committed; a drift means the build output was not regenerated.
      - name: Verify committed stylesheet is up to date
        run: git diff --exit-code -- styles/mgt2.css

      # The compiled compendiums are not committed. `npm run build` would need the workspace audit,
      # which is not in this repo; `compile` proves the committed packs/_source still builds.
      - name: Compile compendiums
        run: npm run compile
