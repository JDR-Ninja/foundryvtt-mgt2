name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - run: npm run build

      - name: Read version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # version and download are derived from the tag so they can never drift from the release.
      - name: Stamp system.json
        run: |
          node -e '
            const fs = require("fs");
            const v = process.env.VERSION;
            const m = JSON.parse(fs.readFileSync("system.json", "utf8"));
            m.version = v;
            m.download = `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/v${v}/mgt2.zip`;
            fs.writeFileSync("system.json", JSON.stringify(m, null, "\t") + "\n");
          '

      # Explicit include list: src/sass, web/ and the tooling files are not part of the package.
      - name: Package
        run: |
          zip -r mgt2.zip \
            system.json \
            README.md \
            CHANGELOG.md \
            LICENSE \
            src/module \
            templates \
            styles \
            lang \
            assets

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$VERSION" \
            --notes "See CHANGELOG.md" \
            system.json mgt2.zip
