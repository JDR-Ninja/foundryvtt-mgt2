name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: npm install

      - name: Read version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # version and download are derived from the tag so they can never drift from the release.
      - name: Stamp system.json
        run: |
          node -e '
            const fs = require("fs");
            const v = process.env.VERSION;
            const m = JSON.parse(fs.readFileSync("system.json", "utf8"));
            m.version = v;
            m.download = `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/v${v}/mgt2.zip`;
            fs.writeFileSync("system.json", JSON.stringify(m, null, "\t") + "\n");
          '

      # Builds the stylesheet, compiles the compendiums and zips them. The include list lives in
      # tools/package.mjs, so this archive is the one `npm run package` builds locally. Stamping
      # comes first: the manifest inside the ZIP is the stamped one.
      - name: Package
        run: npm run package

      # A tag made from the Releases page arrives here with its release already created, and `create`
      # then refuses; uploading instead is what puts the two files on it. `-e` does not fire on `||`.
      - name: Create the release, or fill one that already exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$VERSION" \
            --notes "See CHANGELOG.md" \
            system.json mgt2.zip \
          || gh release upload "$GITHUB_REF_NAME" system.json mgt2.zip --clobber
