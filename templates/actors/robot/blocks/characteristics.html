{{! One type with a flag, not a chassis Item and not a second sub-type. }}
{{#if system.traveller.enabled}}
<div class="block">
	<div class="sect">
		<h3>{{localize 'MGT2.Actor.robot.Characteristics'}}</h3>
		<i class="fa-solid fa-circle-info note" data-tooltip="{{localize 'MGT2.Actor.robot.TravellerHint'}}"></i>
	</div>
	<div class="chars">
		<div class="char-list">
			{{#each robot.traveller}}
			{{> systems/mgt2/templates/actors/parts/characteristic.html pool=true}}
			{{/each}}
		</div>
	</div>
	<div class="grid edit-only">
		<label>
			<span class="lbl">{{localize 'MGT2.Actor.robot.Society'}}</span>
			{{formInput systemFields.traveller.fields.society name="system.traveller.society" value=system.traveller.society localize=true classes="f"}}
		</label>
	</div>
</div>
{{/if}}
