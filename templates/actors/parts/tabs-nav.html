<nav class="{{navClass}}" data-group="{{group}}"{{#if navStyle}} style="{{navStyle}}"{{/if}}>
  {{#each tabs as |tab|}}
  <a class="{{tab.cssClass}}" data-action="tab" data-group="{{tab.group}}" data-tab="{{tab.id}}"{{#if tab.tooltip}} data-tooltip="{{localize tab.tooltip}}"{{/if}}>{{#if tab.icon}}<i class="{{tab.icon}}"></i>{{/if}}{{#if tab.label}}{{localize tab.label}}{{/if}}</a>
  {{/each}}
</nav>
