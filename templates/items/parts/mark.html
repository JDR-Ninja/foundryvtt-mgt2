{{! A status mark: a check or a cross knocked out of a filled disc, an open ring, or the line's own sign. }}
<i class="mk{{#if tone}} {{tone}}{{/if}}">{{#if (eq tone "good")}}<svg viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="5.5"/><path d="M3.6 6.2l1.6 1.6 3.2-3.5"/></svg>{{else if (eq tone "bad")}}<svg viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="5.5"/><path d="M4.3 4.3l3.4 3.4M7.7 4.3l-3.4 3.4"/></svg>{{else if (eq tone "open")}}<svg viewBox="0 0 12 12" aria-hidden="true"><circle class="ring" cx="6" cy="6" r="4.8"/></svg>{{else}}{{mark}}{{/if}}</i>
